<!doctype html><html><head><title>Campamentos · revisión local</title><style>body{margin:0;background:#17251e;font:14px system-ui;color:white}nav{position:fixed;top:20px;left:20px;z-index:2;display:flex;gap:8px}button{background:#1b302a;color:#eedbbe;border:1px solid #718478;padding:9px;border-radius:6px;cursor:pointer}</style></head><body><nav id="camps"></nav><script type="module">
import * as THREE from 'three';
import { createProceduralTextures } from '/src/game/shared/textures.ts';
import { buildDawnreachMap } from '/src/game/map/buildDawnreachMap.ts';
import { polishRiverBridges } from '/src/game/map/polishRiverBridges.ts';
import { createMapCollisionWorld } from '/src/game/map/collisionWorld.ts';
import { DAWNREACH_LAYOUT } from '/src/game/map/mapLayout.ts';
const scene = new THREE.Scene();scene.background=new THREE.Color(0x758994);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
const textures=createProceduralTextures(),world=buildDawnreachMap(textures);polishRiverBridges(world);scene.add(world);createMapCollisionWorld(world);
scene.add(new THREE.HemisphereLight(0xc7deed,0x384632,1.05));const sun=new THREE.DirectionalLight(0xffeed2,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.normalBias=.025;scene.add(sun,sun.target);
const camera=new THREE.OrthographicCamera(-8*innerWidth/innerHeight,8*innerWidth/innerHeight,8,-8,.1,120);
function select(index){const [x,z]=DAWNREACH_LAYOUT.camps[index];camera.position.set(x,34,z+16.3);camera.lookAt(x,0,z);sun.position.set(x-16,32,z+14);sun.target.position.set(x,0,z);sun.target.updateMatrixWorld();}
DAWNREACH_LAYOUT.camps.forEach((_,i)=>{const b=document.createElement('button');b.textContent='Campamento '+(i+1);b.onclick=()=>select(i);document.querySelector('#camps').appendChild(b)});select(2);
const camps=world.getObjectByName('jungle-camps');function frame(t){requestAnimationFrame(frame);camps.userData.animate(t/1000);renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
